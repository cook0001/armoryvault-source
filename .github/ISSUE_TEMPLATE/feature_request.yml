name: Feature Request
description: Propose an idea, new feature, or enhancement for ArmoryVault Desktop
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to improve **ArmoryVault Desktop**? We love feedback from collectors, reloaders, competitive shooters, and firearm enthusiasts!

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / Use Case
      description: Is your feature request related to a specific workflow problem or need?
      placeholder: "e.g. When performing ladder testing for precision handloads, I need to..."
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution & UI Details
      description: Describe what you would like to happen and how the interface or workflow should look.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered?

  - type: checkboxes
    id: architecture_alignment
    attributes:
      label: Architectural Alignment
      options:
        - label: This feature aligns with ArmoryVault's 100% Zero-Cloud, local-first privacy architecture (no remote third-party databases, no telemetry).
          required: true
