name: Build All Native Installers (Tauri v2)

on:
  push:
    branches:
      - main
      - beta
      - 'beta/**'
    tags:
      - 'v*-beta*'
      - 'v*'
  pull_request:
    branches:
      - main
      - beta
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release (draft)'
        type: boolean
        default: false
        required: false
      tag_name:
        description: 'Release Tag Name (e.g. v2.11.0-beta.1)'
        type: string
        default: ''
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-tauri:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
            args: '--target x86_64-apple-darwin'
            artifact_name: 'ArmoryVault-macOS-x86_64'
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'
            artifact_name: 'ArmoryVault-macOS-aarch64'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: '--target x86_64-pc-windows-msvc'
            artifact_name: 'ArmoryVault-Windows-x64'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            args: '--target x86_64-unknown-linux-gnu'
            artifact_name: 'ArmoryVault-Linux-x64'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libayatana-appindicator3-dev

      - name: Install frontend dependencies
        run: npm ci || npm install

      - name: Build Native Installers via Tauri Action
        id: tauri-build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ inputs.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
          releaseName: 'ArmoryVault Beta __VERSION__'
          releaseBody: 'Automated cross-platform build from beta branch. See CHANGELOG.md for details.'
          releaseDraft: true
          prerelease: true

      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn

  notify-store:
    name: Notify ArmsTrader Store
    needs: [build-tauri]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
    steps:
      - name: Trigger ArmsTrader Store Sync
        run: |
          echo "ArmoryVault build completed. Attempting to trigger ArmsTrader Store release sync..."
          if [ -n "${{ secrets.ARMSTRADER_DISPATCH_TOKEN }}" ]; then
            echo "Dispatching release sync to cook0001/armstrader.store..."
            curl -s -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.ARMSTRADER_DISPATCH_TOKEN }}" \
              https://api.github.com/repos/cook0001/armstrader.store/dispatches \
              -d '{"event_type": "app_released", "client_payload": {"app": "armoryvault", "version": "${{ github.ref_name }}"}}' || true
          else
            echo "Notice: ARMSTRADER_DISPATCH_TOKEN not configured in source repository."
            echo "ArmsTrader Store autonomous 2-hour cron sync will detect and stream these new binaries to the server."
          fi

